<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOD_EYE // SYSTEM_OVERRIDE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --neon-cyan: #00f3ff;
            --neon-red: #ff003c;
            --neon-green: #0f0;
            --bg-glass: rgba(5, 10, 15, 0.85);
            --border-tech: 1px solid rgba(0, 243, 255, 0.3);
            --font-main: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body { 
            background: #000; 
            color: var(--neon-cyan); 
            font-family: var(--font-main); 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw; 
        }

        /* --- 1. BOOT SCREEN (LOADING) --- */
        #boot-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s ease;
        }
        .loader-bar {
            width: 300px; height: 4px; background: #333; margin-top: 20px;
            position: relative; overflow: hidden;
        }
        .loader-progress {
            position: absolute; top: 0; left: 0; height: 100%; width: 0%;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: load 3s forwards;
        }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }

        /* --- 2. MAP (BACKGROUND) --- */
        #map {
            position: absolute; inset: 0; z-index: 1;
            background: #000;
            filter: grayscale(100%) contrast(1.2) brightness(0.6) sepia(100%) hue-rotate(180deg) saturate(300%);
            transition: filter 1s ease;
        }
        /* Mode Locked (Map jadi agak normal) */
        body.mode-locked #map {
            filter: grayscale(20%) contrast(1.1) brightness(0.8) sepia(20%) hue-rotate(180deg) saturate(150%);
        }
        .leaflet-control-zoom, .leaflet-control-attribution { display: none !important; }

        /* --- 3. VISUAL EFFECTS (OVERLAY) --- */
        .scanlines {
            position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 3px, 3px 100%;
            opacity: 0.4;
        }
        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 6;
            background: radial-gradient(circle, transparent 60%, black 150%);
        }

        /* --- 4. HUD CONTAINER (Global Wrapper) --- */
        .hud-container {
            position: absolute; inset: 0; z-index: 10;
            pointer-events: none; /* PENTING: Agar klik tembus ke map */
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px;
        }

        /* HEADER */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.8), transparent);
            padding: 10px; border-bottom: 1px solid var(--neon-cyan);
        }
        .sys-status { font-size: 12px; letter-spacing: 2px; color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green); }

        /* BOTTOM AREA (Terminal & Intel) */
        .bottom-area {
            display: flex; justify-content: space-between; align-items: flex-end;
            gap: 20px;
        }

        /* --- TERMINAL (KIRI BAWAH) --- */
        .terminal-panel {
            pointer-events: auto; /* Agar input bisa diklik */
            width: 450px; height: 250px;
            background: var(--bg-glass);
            border: var(--border-tech);
            border-left: 4px solid var(--neon-cyan);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            font-size: 13px;
        }
        .term-header {
            background: rgba(0, 243, 255, 0.1); padding: 5px 10px;
            font-weight: 800; border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            display: flex; justify-content: space-between;
        }
        .term-body {
            flex: 1; overflow-y: auto; padding: 10px;
            color: #ddd; scroll-behavior: smooth;
        }
        /* Custom Scrollbar */
        .term-body::-webkit-scrollbar { width: 5px; }
        .term-body::-webkit-scrollbar-thumb { background: var(--neon-cyan); }
        
        .log-entry { margin-bottom: 4px; line-height: 1.4; }
        .log-sys { color: #888; }
        .log-success { color: var(--neon-green); }
        .log-error { color: var(--neon-red); }

        .term-input-area {
            border-top: 1px solid rgba(255,255,255,0.2);
            padding: 10px; display: flex; align-items: center; background: rgba(0,0,0,0.5);
        }
        .prompt { color: var(--neon-cyan); margin-right: 8px; font-weight: bold; }
        #cmdInput {
            background: transparent; border: none; color: #fff; width: 100%;
            font-family: var(--font-main); font-size: 14px;
        }

        /* --- INTEL BOX (KANAN BAWAH) --- */
        .intel-panel {
            pointer-events: auto;
            width: 320px;
            background: var(--bg-glass);
            border: var(--border-tech);
            padding: 10px;
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column; gap: 10px;
            transform: skewX(-5deg); /* Efek miring futuristik */
        }
        .intel-title {
            color: #fff; border-bottom: 2px solid var(--neon-red); padding-bottom: 5px;
            text-align: right; font-weight: 800; letter-spacing: 1px;
            transform: skewX(5deg); /* Balikin text biar lurus */
        }
        
        .photo-container {
            width: 100%; height: 180px; background: #000;
            position: relative; overflow: hidden; border: 1px solid #333;
            transform: skewX(5deg);
        }
        .rec-indicator {
            position: absolute; top: 10px; left: 10px; z-index: 2;
            background: var(--neon-red); color: white; padding: 2px 6px; 
            font-size: 10px; font-weight: bold; border-radius: 2px;
            animation: blink 1s infinite;
        }
        #target-photo {
            width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s;
        }
        
        .data-grid { transform: skewX(5deg); font-size: 12px; color: #aaa; }
        .data-row { display: flex; justify-content: space-between; border-bottom: 1px dashed #333; padding: 4px 0; }
        .val { color: var(--neon-cyan); font-weight: bold; }

        /* Animations */
        @keyframes blink { 50% { opacity: 0; } }

        /* Responsive Fix */
        @media (max-width: 800px) {
            .bottom-area { flex-direction: column-reverse; align-items: stretch; }
            .terminal-panel, .intel-panel { width: 100%; transform: none; }
            .intel-panel, .photo-container, .intel-title, .data-grid { transform: none; }
            .terminal-panel { height: 200px; }
        }
    </style>
</head>
<body>

    <div id="boot-screen">
        <h2 style="color:white; letter-spacing:5px;">INITIALIZING SYSTEM</h2>
        <div class="loader-bar"><div class="loader-progress"></div></div>
        <p style="margin-top:10px; color:#555; font-size:12px;">ESTABLISHING SECURE CONNECTION...</p>
    </div>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div id="map"></div>

    <div class="hud-container">
        
        <div class="top-bar">
            <div style="font-weight:800; font-size:18px;">GOD_EYE <span style="font-size:10px; color:#888;">v4.0.1</span></div>
            <div class="sys-status">● SYSTEM ONLINE</div>
        </div>

        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:200px; height:200px; border:1px dashed rgba(0,243,255,0.3); border-radius:50%; pointer-events:none; display:flex; justify-content:center; align-items:center;">
            <div style="width:10px; height:10px; background:var(--neon-red);"></div>
        </div>

        <div class="bottom-area">
            
            <div class="terminal-panel">
                <div class="term-header">
                    <span>ROOT_ACCESS</span>
                    <span>[CONNECTED]</span>
                </div>
                <div class="term-body" id="termOutput">
                    <div class="log-entry log-sys">> Bios check... OK</div>
                    <div class="log-entry log-sys">> Loading satellite modules... OK</div>
                    <div class="log-entry log-success">> Welcome, Admin.</div>
                </div>
                <div class="term-input-area">
                    <span class="prompt">root@system:~#</span>
                    <input type="text" id="cmdInput" placeholder="Enter command (e.g., 'hack', 'scan')..." autocomplete="off">
                </div>
            </div>

            <div class="intel-panel">
                <div class="intel-title">LIVE SURVEILLANCE</div>
                <div class="photo-container">
                    <div class="rec-indicator">REC</div>
                    <img id="target-photo" src="" alt="">
                    <div id="loading-txt" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--neon-cyan); font-weight:bold;">SEARCHING...</div>
                </div>
                <div class="data-grid">
                    <div class="data-row"><span>LOCATION:</span> <span class="val" id="t-name">--</span></div>
                    <div class="data-row"><span>COORDS:</span> <span class="val" id="t-lat">00.0000</span></div>
                    <div class="data-row"><span>STATUS:</span> <span class="val" style="color:var(--neon-green)">ACTIVE</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- BOOT SEQUENCE ---
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('boot-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot-screen').style.display = 'none';
                    startTracking(); // Mulai tracking setelah boot
                }, 1000);
            }, 3000); // 3 Detik loading
        };

        // --- DATABASE LOKASI & FOTO ASLI ---
        const targets = [
            { name: "MONAS, JAKARTA", lat: -6.175392, lng: 106.827153, img: "https://images.unsplash.com/photo-1555899434-94d1368d7dd6?w=600&q=80" },
            { name: "SHIBUYA, TOKYO", lat: 35.659100, lng: 139.700600, img: "https://images.unsplash.com/photo-1542931287-023b922fa89b?w=600&q=80" },
            { name: "EIFFEL TOWER, PARIS", lat: 48.8584, lng: 2.2945, img: "https://images.unsplash.com/photo-1511739001486-915228773898?w=600&q=80" },
            { name: "TIMES SQUARE, NYC", lat: 40.7580, lng: -73.9855, img: "https://images.unsplash.com/photo-1534430480872-3498386e7856?w=600&q=80" },
            { name: "OPERA HOUSE, SYDNEY", lat: -33.8568, lng: 151.2153, img: "https://images.unsplash.com/photo-1523059623039-a9ed027e7fad?w=600&q=80" }
        ];

        // --- MAP SETUP ---
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20, 0], 2);
        
        // Gunakan Google Satellite Tiles (Hybrid)
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20
        }).addTo(map);

        const hackerMarker = L.divIcon({
            className: 'custom-marker',
            html: '<div style="width:16px; height:16px; background:var(--neon-cyan); border-radius:50%; box-shadow:0 0 15px var(--neon-cyan); border:2px solid white;"></div>',
            iconSize: [16, 16], iconAnchor: [8, 8]
        });

        let currentMarker = null;

        // --- TERMINAL LOGIC ---
        const cmdInput = document.getElementById('cmdInput');
        const termOutput = document.getElementById('termOutput');

        function addLog(msg, type='') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerHTML = msg;
            termOutput.appendChild(div);
            termOutput.scrollTop = termOutput.scrollHeight;
        }

        cmdInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') {
                const cmd = cmdInput.value.trim();
                if(!cmd) return;
                
                addLog(`root@system:~# ${cmd}`, 'log-sys');
                cmdInput.value = '';
                cmdInput.disabled = true; // Lock input during process

                // Simulasi Proses
                setTimeout(() => addLog('> Decrypting protocol...', 'log-sys'), 500);
                setTimeout(() => addLog('> Bypassing firewall...', 'log-sys'), 1200);
                setTimeout(() => {
                    if(cmd.includes('hack')) addLog('> ACCESS GRANTED.', 'log-success');
                    else addLog('> COMMAND EXECUTED.', 'log-success');
                    cmdInput.disabled = false;
                    cmdInput.focus();
                }, 2000);
            }
        });

        // --- TRACKING LOGIC ---
        function startTracking() {
            moveTarget();
            setInterval(moveTarget, 12000); // Pindah tiap 12 detik
        }

        function moveTarget() {
            const t = targets[Math.floor(Math.random() * targets.length)];
            
            // UI Reset
            document.body.classList.remove('mode-locked');
            document.getElementById('target-photo').style.opacity = '0';
            document.getElementById('loading-txt').style.display = 'block';
            document.getElementById('t-name').innerText = "SEARCHING...";
            
            addLog(`> Auto-scan initiated. Tracking: ${t.name}`, 'log-sys');

            // Fly Animation
            map.flyTo([t.lat, t.lng], 16, { duration: 5, easeLinearity: 0.2 });

            setTimeout(() => {
                if(currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.marker([t.lat, t.lng], {icon: hackerMarker}).addTo(map);
                
                // Update UI Success
                document.body.classList.add('mode-locked');
                document.getElementById('t-name').innerText = t.name;
                document.getElementById('t-lat').innerText = `${t.lat.toFixed(4)}, ${t.lng.toFixed(4)}`;
                
                const img = document.getElementById('target-photo');
                img.src = t.img;
                img.onload = () => {
                    document.getElementById('loading-txt').style.display = 'none';
                    img.style.opacity = '1';
                };
                
                addLog(`> TARGET LOCKED: ${t.name}`, 'log-success');

            }, 5000);
        }

    </script>
</body>
</html>
